name: DonorGram checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline-ai.js'
      - 'OFFLINE_AI.md'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate web assets (no APK build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: node --check offline-ai.js

      - name: Bundle local web assets
        run: npm run build:web

      - name: Verify offline module is bundled
        run: test -s www/offline-ai.js && grep -q 'offline-ai.js' www/index.html
