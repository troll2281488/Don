services:
  - type: worker
    name: donai-telegram-bot
    runtime: python
    buildCommand: pip install -r telegram-bot/requirements.txt
    startCommand: python telegram-bot/main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OFOX_API_KEY
        sync: false
      - key: OFOX_BASE_URL
        value: https://api.ofox.ai/v1
      - key: OFOX_MODEL
        value: openai/gpt-6.1-sol
